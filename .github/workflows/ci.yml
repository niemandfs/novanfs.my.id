# Nama pipeline, muncul di tab Actions
name: CI

# Kapan pipeline jalan
on:
  # Setiap ada Pull Request
  pull_request:
  # Setiap ada push ke branch main
  push:
    branches: [main]

jobs:
  # Job pertama: cek kode dan pastikan website bisa di-build
  build:
    runs-on: ubuntu-latest

    steps:
      # Ambil kode dari repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Pasang Node.js sesuai versi di file .nvmrc,
      # dan simpan cache dependency biar run berikutnya lebih cepat
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install dependency persis sesuai package-lock.json
      - name: Install dependencies
        run: npm ci

      # Cek kesalahan umum di kode JavaScript/React
      - name: Lint
        run: npm run lint

      # Build website. Kalau gagal di sini, berarti Cloudflare juga bakal gagal
      - name: Build
        run: npm run build

  # Job kedua: cari password, token, atau key yang ke-commit
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      # Ambil seluruh riwayat commit, biar rahasia di commit lama juga ketemu
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Jalankan Gitleaks. Kalau nemu rahasia, step ini gagal
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
